version: '3.0'

services:
  grafana:
    container_name: 'emnify-plugin-datasource'
    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-11.0.1}
    ports:
      - 3000:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/emnify-plugin-datasource
      - ./provisioning:/etc/grafana/provisioning
      - ./grafana-data:/var/lib/grafana
      - ~/.aws:/usr/share/grafana/.aws:ro
    environment:
      - GF_ALLOW_LOADING_UNSIGNED_PLUGINS=emnify-cloudtraillake-datasource
#      - GF_LOG_LEVEL=debug
      - GF_LOG_FILTERS=plugin.emnify-cloudtraillake-datasource:debug
